version: '3.1'

services:
  mongo:
    build: .
    container_name: mongo-todo
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=CHANGE_ME_LOCAL_PASSWORD
      - MONGO_INITDB_DATABASE=todo-app
